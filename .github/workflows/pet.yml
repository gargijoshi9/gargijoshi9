name: Update YourTomo Cat

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pet:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate YourTomo
        uses: prsdx/github-pet@v1
        with:
          username: gargijoshi9
          timezone-offset-minutes: "0"
          pet-name: "mochi"
          accent-color: "#C9819A"
          display-name: "Gargi"

      - name: Clean generated pet SVGs
        run: |
          sed -i '/state: /d' dist/*.svg
          sed -i -E '/^<rect width="894" height="(190|158)" /d' dist/pet*.svg
